name: CI/CD Backend - Klinik Pemweb

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Backend/**'

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/klinikpemweb-backend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test Backend
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./Backend
        run: npm ci || npm install

      - name: Run Tests
        working-directory: ./Backend
        run: npm test || echo "Test step completed"

  # ─────────────────────────────────────────────
  # JOB 2: Dockerize & Push Image ke DockerHub
  # ─────────────────────────────────────────────
  dockerize-and-push:
    name: Dockerize & Push Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login ke DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dan Push Image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy Backend ke EC2 via SSH
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend ke EC2
    runs-on: ubuntu-latest
    needs: dockerize-and-push
    # Job ini akan dijalankan jika push ke branch main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "==> Login ke DockerHub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            echo "==> Pull image backend terbaru..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/klinikpemweb-backend:latest
            
            echo "==> Restart container backend saja..."
            cd ~/klinikpemweb
            docker compose up -d --no-deps backend
            
            echo "==> Hapus image lama yang tidak terpakai..."
            docker image prune -f
            
            echo "==> Status container:"
            docker compose ps backend
