name: CI/CD Frontend - Klinik Pemweb

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/klinikpemweb-frontend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Install & Test Frontend (tanpa build ulang)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --passWithNoTests || echo "Test step completed"

  # ─────────────────────────────────────────────
  # JOB 2: Dockerize & Push Image ke DockerHub
  # ─────────────────────────────────────────────
  dockerize-and-push:
    name: Dockerize & Push Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login ke DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dan Push Image Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ─────────────────────────────────────────────
  # JOB 3: Deploy Frontend ke EC2 via SSH
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend ke EC2
    runs-on: ubuntu-latest
    needs: dockerize-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "==> Login ke DockerHub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "==> Bersihkan disk: hapus image, container, dan cache Docker yang tidak terpakai..."
            docker container prune -f
            docker image prune -a -f
            docker volume prune -f
            docker builder prune -f
            echo "==> Sisa disk setelah cleanup:"
            df -h /

            echo "==> Masuk ke direktori project..."
            cd ~/cloud-klinik-website

            echo "==> Membuat docker-compose.yml di server..."
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/klinikpemweb-frontend:latest
                container_name: klinikpemweb_frontend
                ports:
                  - "80:3000"
                restart: always
                env_file:
                  - ./frontend/.env
            COMPOSE_EOF

            echo "==> Pull image terbaru dari DockerHub..."
            docker compose pull frontend

            echo "==> Restart container frontend..."
            docker compose up -d --no-deps frontend

            echo "==> Hapus image lama yang tidak terpakai..."
            docker image prune -f

            echo "==> Status container:"
            docker compose ps frontend
