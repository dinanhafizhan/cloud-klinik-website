version: '3.8'

services:
  backend:
    image: ariilalhafizh/klinikpemweb-backend:latest
    container_name: klinikpemweb_backend
    ports:
      - "80:5000"
    restart: always
    volumes:
      - ./Backend/gcs-key.json:/app/gcs-key.json
    env_file:
      - ./Backend/.env

  frontend:
    image: ariilalhafizh/klinikpemweb-frontend:latest
    container_name: klinikpemweb_frontend
    ports:
      - "80:3000"
    restart: always
    env_file:
      - ./frontend/.env
