version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: klinikpemweb_backend
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - ./Backend/.env

  frontend:
    build: ./frontend
    container_name: klinikpemweb_frontend
    ports:
      - "80:3000"
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - WDS_SOCKET_PORT=0
    stdin_open: true
    tty: true
    depends_on:
      - backend
